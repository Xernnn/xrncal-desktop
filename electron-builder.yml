appId: app.xrncal.desktop
productName: xrncal
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  # The app icon, which the main process reads by path for the tray and the
  # window (src/main/app-icon.ts); unpacked so those OS APIs can open it.
  - resources/icon.png
  - resources/icon.ico
asarUnpack:
  - resources/**

# Electron's build-time switches. Off: running the binary as plain Node
# (ELECTRON_RUN_AS_NODE), NODE_OPTIONS and --inspect - each lets any program
# running as the user drive xrncal, which holds the keyring's key to the saved
# sign-ins. On: loading the app only from its own app.asar, and encrypting the
# cookie store. (Asar integrity validation is left off until it can be tried
# on a signed Windows build.)
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true

# Where installed builds look for updates (src/main/updater.ts). A tagged push
# runs .github/workflows/release.yml, which uploads the installers and the
# latest*.yml files electron-updater reads to a draft release; publishing that
# draft is what ships it.
publish:
  provider: github
  owner: Xernnn
  repo: xrncal-desktop
  releaseType: draft

# "Open with xrncal" for calendar files. The installer registers it on
# Windows; on Linux the AppImage's desktop entry carries the MIME type, and so
# does the launcher scripts/install-linux-app.sh writes. A file opened this way
# arrives in argv (src/main/opened-ics-files.ts).
fileAssociations:
  - ext: ics
    name: iCalendar file
    description: Calendar events
    mimeType: text/calendar
    role: Viewer

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: xrncal

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Office;Calendar;
  # Electron 38+ runs as a native Wayland client in a Wayland session, where a
  # window cannot place itself or stay on top - the tray's mini window does
  # both. XWayland keeps them working; this has to be a command-line switch, as
  # app.commandLine.appendSwitch() runs too late to choose the platform.
  executableArgs:
    - --ozone-platform=x11
  synopsis: Modern desktop calendar with multi-provider sync
  description: xrncal desktop client for Windows and Linux
  icon: resources/icon.png
