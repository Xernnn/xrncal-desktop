name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI checks code and needs to change nothing on the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # No Electron binary is downloaded here: since Electron 42 it is fetched the
    # first time something asks for its path, unit tests stub `electron` (see
    # tests/stubs/electron.ts), and the build only reads its package.json.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22.5 added node:sqlite behind a flag; it's unflagged from 23.4 on. The DB
          # tests require() it directly (src/main/db/sqlite-driver.ts), and the repo
          # doesn't declare better-sqlite3 as a fallback dependency, so CI's Node must
          # actually have it built in, not just be "recent enough" to build the app.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (main + renderer)
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

  ui:
    # Drives the built app through Playwright (e2e/). This one needs the real
    # Electron binary, and a display: xvfb-run gives it a virtual one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: UI tests
        run: xvfb-run -a npm run test:e2e

  caldav:
    # A CalDAV round trip against a real Radicale (tests/integration/, started
    # by its radicale-server.ts). The unit tests stub fetch with what a server
    # is believed to send; here the XML, the iCalendar it stores and hands back,
    # its etags, ctags and preconditions are a server's own. It found the 400
    # every series with a deleted occurrence got on push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # A virtualenv: the runner's Python refuses system-wide pip installs (PEP 668).
      - name: Radicale
        run: |
          python3 -m venv "$RUNNER_TEMP/radicale"
          "$RUNNER_TEMP/radicale/bin/pip" install --quiet radicale==3.9.0
          echo "XRNCAL_RADICALE=$RUNNER_TEMP/radicale/bin/radicale" >> "$GITHUB_ENV"

      - run: npm ci

      - name: CalDAV round trip
        run: npm run test:caldav
